
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>跨区域综合交流考察定制平台 - 专业定制方案</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Noto+Sans+SC:wght@300;400;700&family=Noto+Serif+SC:wght@600;700;900&display=swap" rel="stylesheet">
    
    <!-- Leaflet 资源引入 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <style>
        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            scroll-behavior: smooth;
            background-color: #ffffff;
        }
        .font-header {
            font-family: 'Noto Serif SC', serif;
        }
        .mobile-touch-target {
            min-height: 44px;
            min-width: 44px;
        }
        html, body {
            max-width: 100%;
            overflow-x: hidden;
        }
        .fade-in {
            animation: fadeIn 1s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        ::selection {
            background-color: #b45309;
            color: white;
        }
        
        /* 地图容器基础样式 */
        .leaflet-container {
            font-family: inherit;
            background-color: #f8fafc; /* 使用非常淡的蓝灰色作为底色 */
        }

        /* 仅对瓦片层应用轻微视觉增强，不影响 Marker 与 Popup */
        .leaflet-tile-pane {
            filter: contrast(1.08) brightness(1.02);
            transition: filter 0.3s ease;
        }
        
        /* Custom scrollbar for official feel */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #101D33;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #b45309;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "react-router-dom": "https://esm.sh/react-router-dom@6.28.1?deps=react@19.0.0,react-dom@19.0.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
</head>
<body class="bg-white text-slate-900">
    <div id="root"></div>
      <!-- ✅ Vite + React 入口（必须） -->
  <script type="module" src="/index.tsx"></script>
</body>
</html>
